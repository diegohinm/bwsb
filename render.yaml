# YOLOPulse backend — two services from ONE repo.
#
#   bwsb-api     Web Service.        npm start        → dist/server.js
#                Serves HTTP, reads DB snapshots, holds NO provider keys.
#   bwsb-worker  Background Worker.  npm run worker   → dist/worker.js
#                Calls Mindcase + Databento on a schedule, writes snapshots.
#                This is the ONLY service that needs provider credentials.
#
# Secrets are marked sync:false — set their values in the dashboard, never here.
#
# DATABASE SCHEMA: owned by Prisma Migrate (bwsb/prisma). Run
#   npm run db:setup     (= prisma migrate deploy)
# against the database BEFORE deploying a release that adds or changes a
# migration. It is not run automatically here so a deploy can never alter the
# schema on its own. `npm run prisma:status` reports whether the database is up
# to date.

services:
  - type: web
    name: bwsb-api
    runtime: node
    rootDir: bwsb
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_ROLE
        value: api
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      # Must match the worker's value: this side decides which sessions the API
      # will serve and which ?session= values it rejects.
      - key: ENABLE_EXTENDED_HOURS
        value: "false"
      # Admin access for internal tooling (/admin/reddit-scanner). Empty means
      # nobody is an admin and internal pages are development-only.
      - key: ADMIN_EMAILS
        sync: false
      # NO MINDCASE_* / DATABENTO_* here on purpose: with SERVICE_ROLE=api the
      # process refuses provider calls, so keys would be dead weight and extra
      # exposure. The API answers from the worker's snapshots.

  - type: worker
    name: bwsb-worker
    runtime: node
    rootDir: bwsb
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_ROLE
        value: worker
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Social ingestion (Mindcase) ──────────────────────────────────────
      - key: SOCIAL_DATA_PROVIDER
        value: mindcase
      - key: MINDCASE_API_KEY
        sync: false
      - key: MINDCASE_BASE_URL
        value: https://api.mindcase.co/api/v1
      - key: MINDCASE_MAX_CONCURRENCY
        value: "2"
      - key: MINDCASE_POLL_INTERVAL_MS
        value: "3000"
      - key: MINDCASE_MAX_POLLS
        value: "10"
      - key: MINDCASE_MAX_RETRIES
        value: "3"
      - key: SOCIAL_DATA_REFRESH_SECONDS
        value: "600"
      - key: TICKER_STRIP_REFRESH_SECONDS
        value: "300"

      # ── Reddit ingestion (Mindcase / Arctic Shift) ───────────────────────
      # Feeds reddit_posts / reddit_comments. Changing REDDIT_DATA_MODE is the
      # ONLY thing needed to switch upstream: mindcase | arctic_shift | hybrid |
      # fallback. Worker-only, like every other provider setting here.
      - key: REDDIT_INGESTION_ENABLED
        value: "false"
      - key: REDDIT_INGESTION_REFRESH_SECONDS
        value: "900"
      - key: REDDIT_DATA_MODE
        value: hybrid
      - key: REDDIT_PRIMARY_PROVIDER
        value: arctic_shift
      - key: REDDIT_FALLBACK_PROVIDER
        value: mindcase
      - key: REDDIT_ENABLE_MINDCASE
        value: "true"
      - key: REDDIT_ENABLE_ARCTIC_SHIFT
        value: "true"
      - key: REDDIT_PROVIDER_TIMEOUT_MS
        value: "30000"
      - key: REDDIT_PROVIDER_MAX_RETRIES
        value: "3"
      - key: REDDIT_PROVIDER_RETRY_DELAY_MS
        value: "5000"
      - key: REDDIT_DEDUPLICATE_RESULTS
        value: "true"
      - key: REDDIT_STORE_SOURCE_METADATA
        value: "true"
      - key: MINDCASE_MAX_POLL_ATTEMPTS
        value: "20"
      - key: ARCTIC_SHIFT_BASE_URL
        value: https://arctic-shift.photon-reddit.com
      - key: ARCTIC_SHIFT_REQUEST_DELAY_MS
        value: "1000"

      # ── THE subreddit list ───────────────────────────────────────────────
      # One variable for every provider; the order is the worker's rotation
      # order. Changing it requires a worker restart.
      - key: REDDIT_SUBREDDITS
        value: wallstreetbets,stocks,options,investing,pennystocks

      # ── Arctic Shift paced worker ────────────────────────────────────────
      # ONE request every five minutes for the whole system, round-robin over
      # REDDIT_SUBREDDITS: 12 requests/hour, each community roughly every 25
      # minutes. While this is true it REPLACES REDDIT_INGESTION_ENABLED as the
      # Reddit path — running both would multiply requests by the list length.
      #
      # Two instances of this service are safe: they serialize through a lease
      # in reddit_worker_state, and the request log that enforces the hourly
      # ceiling lives in the same row.
      - key: ARCTIC_SHIFT_ENABLED
        value: "false"
      - key: REDDIT_POLL_INTERVAL_MS
        value: "300000"
      - key: REDDIT_POST_LIMIT
        value: "100"
      - key: REDDIT_INITIAL_LOOKBACK_MINUTES
        value: "30"
      - key: REDDIT_CURSOR_OVERLAP_SECONDS
        value: "120"
      - key: ARCTIC_SHIFT_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: ARCTIC_SHIFT_MAX_RETRIES
        value: "3"
      - key: ARCTIC_SHIFT_RETRY_BASE_DELAY_MS
        value: "5000"

      # ── Market ingestion (Databento) ─────────────────────────────────────
      - key: MARKET_DATA_PROVIDER
        value: databento
      - key: MARKET_DATA_MODE
        value: delayed
      - key: MARKET_DATA_DELAY_MINUTES
        value: "15"
      # Regular session only (09:30-16:00 ET). Set to "true" to re-enable
      # premarket / after-hours / overnight — the code is kept behind this flag.
      - key: ENABLE_EXTENDED_HOURS
        value: "false"
      - key: MARKET_DATA_REFRESH_SECONDS
        value: "60"
      - key: MARKET_MOVERS_REFRESH_SECONDS
        value: "60"
      - key: DATABENTO_API_KEY
        sync: false
      - key: DATABENTO_DATASET
        value: EQUS.MINI
      - key: DATABENTO_OVERNIGHT_DATASET
        value: OCEA.MEMOIR
