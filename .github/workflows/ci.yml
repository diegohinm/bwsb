name: YOLOPulse CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint


  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck


  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test


  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build


  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: main - bwsb-api

    # Only on pushes/merges to main, or when started by hand (Actions tab →
    # "Run workflow"). Every run applies the checked-out branch's Prisma
    # migrations to the ONE shared Supabase test project, so running on feature
    # branches or pull requests could leave that database ahead of another
    # branch's schema. Lint, typecheck, unit tests and build still run on every
    # push and pull request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    # ONE Supabase test project serves every run. Queue runs instead of letting
    # two migrate, seed or write fixtures at the same time (e.g. a merge to main
    # landing while a manually started run is still going).
    concurrency:
      group: supabase-test-database
      cancel-in-progress: false

    permissions:
      contents: read

    # The dedicated TEST project only, mapped onto the names the app reads.
    # Production credentials are never referenced in this workflow.
    env:
      NODE_ENV: test
      TEST_DATABASE: "true"
      #TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard (TEST_DATABASE=true, not production, all three secrets present,
      # database and API from the same Supabase project) and only then:
      # npm run prisma:generate → prisma:migrate:deploy → prisma:seed → prisma:status.
      # One script, so no step can ever run a migration ahead of the guard.
      - name: Prepare test database (guard, generate, migrate deploy, seed)
        run: bash scripts/setup-test-db.sh
      - name: Run integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration